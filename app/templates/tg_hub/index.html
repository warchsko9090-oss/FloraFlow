<!DOCTYPE html>
<html lang="ru" data-tg-sdk="{{ url_for('static', filename='tg_common/telegram-web-app.js') }}?v=20260901sdk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
    <meta name="theme-color" content="#111814">
    <title>FloraFlow</title>
    <script>window.__ffLaunch={hash:String(location.hash||''),href:String(location.href||''),search:String(location.search||'')};</script>
    <link rel="preload" href="{{ url_for('static', filename='tg_common/telegram-web-app.js') }}?v=20260901sdk" as="script">
    <script src="{{ url_for('static', filename='tg_common/tg_auth.js') }}?v=20260923c" defer></script>
    <script src="{{ url_for('static', filename='tg_common/scroll_top.js') }}?v=20260925top" defer></script>
    <script src="{{ url_for('static', filename='tg_hub/app.js') }}?v=20260923c" defer></script>
    <style>
      :root { color-scheme: light; --ink:#14201a; --muted:#5c6b63; --line:rgba(20,32,26,.12); --bg:#f4f0e6; --green:#1B5E20; }
      * { box-sizing: border-box; }
      body { margin:0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--ink);
        min-height: 100dvh; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
      .wrap { max-width: 420px; margin: 0 auto; }
      .brand { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; margin: 12px 0 4px; }
      .sub { color: var(--muted); font-size: 14px; line-height: 1.4; margin: 0 0 20px; }
      .tabs { display: flex; flex-direction: column; gap: 10px; }
      .tab {
        display: block; width: 100%; text-align: left; border: 1px solid var(--line);
        background: #fff; border-radius: 16px; padding: 16px 18px; color: inherit; text-decoration: none;
        font-size: 16px; font-weight: 700;
      }
      .tab span { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-top: 4px; }
      .tab:active { background: #f0f7f1; }
      .hint { color: var(--muted); font-size: 13px; margin-top: 18px; line-height: 1.4; }
      .err { color: #b91c1c; }
    </style>
</head>
<body>
    <div class="wrap" id="view">
        <p class="sub">Загрузка…</p>
    </div>
</body>
</html>
