{% extends "base.html" %}
{% block content %}
<style>
    .tg-stage { max-width: 1100px; margin: 0 auto; }
    .tg-cal {
        width: 100%;
        height: auto;
        border-radius: 12px;
        display: block;
        border: 1px solid #d7e3d9;
        background: #fff;
    }
</style>
<div class="tg-stage" hx-boost="false">
    <div class="d-flex justify-content-between align-items-center mb-3 gap-2">
        <div>
            <h4 class="fw-bold m-0">Снимок плана в чат продаж</h4>
            <div class="text-muted small">С сегодняшнего дня и на 15 дней вперёд. Дни стоят по колонкам недели, без подписи.</div>
        </div>
        <a href="{{ url_for('digging.digging_planning') }}" class="btn btn-outline-secondary btn-sm">К плану</a>
    </div>
    {% if notice %}
    <div class="alert alert-secondary">{{ notice }}</div>
    {% endif %}
    <img class="tg-cal" alt="План выкопки"
         src="{{ url_for('digging.dig_plan_chat_image') }}">
    <form method="post" class="mt-3" hx-boost="false">
        <button class="btn btn-primary" type="submit">Отправить в чат продаж</button>
    </form>
</div>
{% endblock %}
